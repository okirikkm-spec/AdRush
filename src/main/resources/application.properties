spring.application.name=AdrenRush Website Backend

# ====== Подключение к БД (PostgreSQL) ======
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adrenrush_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ====== JWT ======
jwt.secret=${JWT_SECRET:adrenrush-super-secret-key-minimum-32-chars-long}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ====== Почта (код подтверждения при привязке почты в профиле) ======
# Пока MAIL_HOST пуст, JavaMailSender не создаётся: письма не уходят,
# а код пишется в лог приложения (см. MailService) — удобно для разработки.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# 465 — SMTPS (ssl.enable), 587 — STARTTLS. По умолчанию настроено на 465.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Адрес в поле «От кого». Если пусто — берётся MAIL_USERNAME
# (у большинства провайдеров «От кого» обязан совпадать с логином SMTP).
mail.from=${MAIL_FROM:}

# ====== Загрузка файлов ======
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# ====== MinIO ======
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_USER:minioadmin}
minio.secret-key=${MINIO_PASSWORD:minioadmin}
minio.bucket=${MINIO_BUCKET:adrenrush-media}
minio.enabled=${MINIO_ENABLED:true}

# ====== Стартовый администратор ======
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
# Супер-администраторы (через запятую): получают и сохраняют роль ADMIN автоматически,
# их нельзя забанить/удалить/разжаловать. Управлять админ-правами может только супер-админ.
moderation.super-admins=${SUPER_ADMINS:Inori}

# ====== Парсер каталога Adrenaline Rush ======
parser.url=${PARSER_URL:https://adrenalinerush.ru/}
# ежедневный запуск (cron): по умолчанию каждый день в 04:00
parser.cron=${PARSER_CRON:0 0 4 * * *}
parser.enabled=${PARSER_ENABLED:true}

# ====== Парсер каталога Red Bull ======
# Сайт за Akamai: запрос с браузерными заголовками (см. RedBullParserService) обычно отдаёт каталог,
# но с дата-центрового IP боевого сервера возможен 403 — тогда нужен резидентный прокси.
redbull.parser.url=${REDBULL_PARSER_URL:https://www.redbull.com/ru-ru/energydrink}
# ежедневный запуск (cron): по умолчанию каждый день в 04:30 (со сдвигом от adrenaline в 04:00)
redbull.parser.cron=${REDBULL_PARSER_CRON:0 30 4 * * *}
redbull.parser.enabled=${REDBULL_PARSER_ENABLED:true}

# ====== Парсер каталога Monster (магазин worldsweet.ru) ======
# Магазин worldsweet.ru: обычный WordPress без ботозащиты, данные берутся из его же публичного
# JSON (WooCommerce Store API), см. WorldSweetParserService. Ссылка — страница раздела каталога;
# товары подкатегорий (Monster США/Китай/Япония/Европа) тоже попадают в выборку, а если нужны все
# бренды магазина — поставьте https://worldsweet.ru/napitki/energeticheskie/
worldsweet.parser.url=${WORLDSWEET_PARSER_URL:https://worldsweet.ru/napitki/energeticheskie/monster-2/}
# Бренд для всех карточек источника: внутри категории Monster подкатегории — это страны
# (Monster США, Япония), поэтому бренд задаётся явно. Пусто — определять по дереву категорий.
worldsweet.parser.brand=${WORLDSWEET_PARSER_BRAND:Monster}
# ежедневный запуск (cron): по умолчанию каждый день в 05:00 (со сдвигом от red bull в 04:30)
worldsweet.parser.cron=${WORLDSWEET_PARSER_CRON:0 0 5 * * *}
worldsweet.parser.enabled=${WORLDSWEET_PARSER_ENABLED:true}
